<svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="desktop-trash-icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
  <symbol id="desktop-copy-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 6V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h1"/></symbol>
</svg>
<header class="desktop-titlebar">
  <div class="desktop-brand"><span class="mark" aria-hidden="true"><b></b><b></b><b></b><b></b></span>字形切片</div>
  <div class="desktop-window-controls">
    <button id="desktop-update" class="desktop-update-button" type="button" hidden>检查更新</button>
    <button id="desktop-minimize" type="button" aria-label="最小化" title="最小化"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button>
    <button id="desktop-maximize" type="button" aria-label="最大化" title="最大化"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="desktop-maximize-icon" d="M3.5 3.5h9v9h-9z"/></svg></button>
    <button id="desktop-close" type="button" aria-label="关闭" title="关闭"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
  </div>
</header>
<main id="desktop-menu" class="desktop-library" aria-labelledby="desktop-menu-title" hidden>
  <div class="desktop-library-content">
    <header class="desktop-menu-heading"><h1 id="desktop-menu-title" tabindex="-1"></h1></header>
    <div id="desktop-cards" class="desktop-cards"></div>
    <p id="desktop-empty" class="desktop-empty" hidden>打开一个模板后，可使用该模板创建字体。</p>
  </div>
  <button id="desktop-prev-menu" type="button" class="desktop-edge-link desktop-edge-left" aria-label="模板菜单" title="模板菜单" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
  </button>
  <button id="desktop-next-menu" type="button" class="desktop-edge-link desktop-edge-right" aria-label="字体菜单" title="字体菜单">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
  </button>
</main>
<main id="desktop-template-setup" class="desktop-template-setup" aria-labelledby="desktop-setup-title" hidden>
  <div class="desktop-setup-content">
    <button id="desktop-setup-back" class="button" type="button">返回模板菜单</button>
    <h1 id="desktop-setup-title">创建新模板</h1>
    <div class="desktop-setup-columns">
      <div id="desktop-setup-fields">
        <label class="desktop-template-label">模板名称
          <input id="desktop-setup-name" form="dimensions" maxlength="100" spellcheck="false" required>
        </label>
      </div>
      <section class="desktop-setup-preview" aria-labelledby="desktop-setup-preview-title">
        <h2 id="desktop-setup-preview-title">模板预览</h2>
        <div class="desktop-setup-stage">
          <svg id="desktop-setup-preview-canvas" aria-hidden="true">
            <rect id="desktop-setup-preview-paper" vector-effect="non-scaling-stroke"/>
            <path id="desktop-setup-preview-grid" vector-effect="non-scaling-stroke"/>
          </svg>
          <p id="desktop-setup-preview-empty" hidden>请输入有效的画布与网格尺寸。</p>
        </div>
      </section>
    </div>
  </div>
</main>
<main id="desktop-font-setup" class="desktop-font-setup" aria-labelledby="desktop-font-setup-title" hidden>
  <div class="desktop-font-setup-content">
    <button id="desktop-font-setup-back" class="button" type="button">返回模板编辑</button>
    <h1 id="desktop-font-setup-title">创建字体</h1>
    <form id="desktop-font-setup-form">
      <label class="desktop-template-label">字体名称
        <input id="desktop-font-setup-name" maxlength="100" spellcheck="false" required>
      </label>
      <fieldset class="desktop-font-scope">
        <legend>字形范围</legend>
        <label><input type="checkbox" name="character-group" value="upper" checked>大写字母 <span>A–Z</span></label>
        <label><input type="checkbox" name="character-group" value="lower" checked>小写字母 <span>a–z</span></label>
        <label><input type="checkbox" name="character-group" value="digits" checked>数字 <span>0–9</span></label>
      </fieldset>
      <button id="desktop-font-setup-submit" class="button accent block" type="submit">创建并编辑</button>
    </form>
  </div>
</main>
<div id="desktop-editor-bar" class="desktop-editor-bar" hidden>
  <button id="desktop-editor-back" type="button" class="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span id="desktop-back-label"></span></button>
  <span id="desktop-save-status" class="desktop-save-status" role="status"></span>
  <button id="desktop-export-project" type="button" class="button">导出</button>
  <button id="desktop-save" type="button" class="button accent">保存</button>
</div>
<main id="desktop-resolve" class="desktop-resolve" aria-labelledby="desktop-resolve-title" hidden>
  <div class="desktop-resolve-content">
    <button id="desktop-resolve-back" type="button" class="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>字体菜单</button>
    <header class="desktop-resolve-heading">
      <h1 id="desktop-resolve-title" tabindex="-1"></h1>
      <p id="desktop-resolve-note"></p>
    </header>
    <div class="desktop-resolve-actions">
      <button id="desktop-preview-adaptation" class="button accent" type="button">适应模板修改</button>
      <button id="desktop-apply-adaptation" class="button accent" type="button" hidden>应用适配</button>
      <button id="desktop-keep-template" class="button" type="button">保留旧模板</button>
    </div>
    <section id="desktop-adaptation" class="desktop-adaptation" aria-label="自动适配预览" hidden>
      <p id="desktop-adaptation-empty" class="desktop-empty" hidden>该字体还没有设计字形。</p>
      <div id="desktop-adapted-glyphs" class="desktop-adapted-glyphs"></div>
    </section>
  </div>
</main>
<dialog id="desktop-import-dialog" class="desktop-dialog" aria-labelledby="desktop-import-title">
  <form id="desktop-import-form">
    <header><h2 id="desktop-import-title"></h2></header>
    <div class="desktop-import-file">
      <button id="desktop-import-choose" class="button" type="button" autofocus>选择 JSON 文件</button>
      <input id="desktop-import-file" type="file" accept=".json,application/json" hidden>
      <output id="desktop-import-filename" aria-live="polite"></output>
    </div>
    <p class="desktop-project-note" id="desktop-import-drop-note" hidden>也可将模板 JSON 文件拖到此弹窗。</p>
    <label id="desktop-import-name-label" class="desktop-template-label" hidden>
      <span id="desktop-import-name-caption"></span>
      <input id="desktop-import-name" maxlength="100" spellcheck="false">
    </label>
    <label id="desktop-import-template-option" class="desktop-dialog-option" hidden>
      <input id="desktop-import-standalone" type="checkbox">将内嵌模板同时导入为独立模板
    </label>
    <label id="desktop-import-template-label" class="desktop-template-label" hidden>
      独立模板名称
      <input id="desktop-import-template-name" maxlength="100" spellcheck="false">
    </label>
    <p id="desktop-import-error" class="desktop-project-error" role="alert" hidden></p>
    <footer class="desktop-dialog-actions">
      <button id="desktop-import-cancel" class="button" type="button">取消</button>
      <button id="desktop-import-submit" class="button accent" type="submit" disabled>导入</button>
    </footer>
  </form>
</dialog>
<dialog id="desktop-export-dialog" class="desktop-dialog" aria-labelledby="desktop-export-title">
  <form method="dialog">
    <header>
      <h2 id="desktop-export-title">导出字体</h2>
      <button type="submit" class="button" autofocus>关闭</button>
    </header>
  </form>
  <div class="desktop-export-options" id="desktop-export-options">
    <button id="desktop-export-font-json" class="button block" type="button"><svg><use href="#i-download"/></svg>导出项目 JSON</button>
  </div>
</dialog>
<dialog id="desktop-project-dialog" class="desktop-dialog" aria-labelledby="desktop-project-title">
  <form id="desktop-project-form">
    <header><h2 id="desktop-project-title"></h2></header>
    <fieldset id="desktop-simplify-destinations" class="desktop-font-scope" hidden>
      <legend>保存方式</legend>
      <label><input type="radio" name="destination" value="original" checked>修改原模板</label>
      <label><input type="radio" name="destination" value="independent">保存为独立模板</label>
      <p id="desktop-simplify-note" class="desktop-project-note" hidden></p>
    </fieldset>
    <label id="desktop-project-name-label" class="desktop-template-label">
      <span id="desktop-project-name-caption"></span>
      <input id="desktop-project-name" maxlength="100" spellcheck="false" required>
    </label>
    <p id="desktop-project-error" class="desktop-project-error" role="alert" hidden></p>
    <footer class="desktop-dialog-actions">
      <button id="desktop-project-cancel" class="button" type="button">取消</button>
      <button id="desktop-project-submit" class="button accent" type="submit"></button>
    </footer>
  </form>
</dialog>
<dialog id="desktop-delete-dialog" class="desktop-dialog" aria-labelledby="desktop-delete-title" aria-describedby="desktop-delete-detail">
  <form method="dialog">
    <header><h2 id="desktop-delete-title"></h2></header>
    <p id="desktop-delete-detail"></p>
    <label id="desktop-delete-linked-label" class="desktop-dialog-option" hidden>
      <input id="desktop-delete-linked" type="checkbox">同时删除关联字体
    </label>
    <footer class="desktop-dialog-actions">
      <button type="submit" value="cancel" class="button" autofocus>取消</button>
      <button type="submit" value="delete" class="button danger">删除</button>
    </footer>
  </form>
</dialog>
<dialog id="desktop-jump-dialog" class="desktop-dialog" aria-labelledby="desktop-jump-title" aria-describedby="desktop-jump-detail">
  <form method="dialog">
    <header><h2 id="desktop-jump-title"></h2></header>
    <p id="desktop-jump-detail"></p>
    <footer class="desktop-dialog-actions">
      <button type="submit" value="cancel" class="button" autofocus>取消</button>
      <button type="submit" value="jump" class="button accent">确认跳转</button>
    </footer>
  </form>
</dialog>
<dialog id="desktop-retain-font" class="desktop-dialog" aria-labelledby="desktop-retain-title" aria-describedby="desktop-retain-detail">
  <form method="dialog">
    <header><h2 id="desktop-retain-title">保留此字体项目？</h2></header>
    <p id="desktop-retain-detail"></p>
    <footer class="desktop-dialog-actions">
      <button type="submit" value="cancel" class="button" autofocus>继续编辑</button>
      <button type="submit" value="discard" class="button">不保留</button>
      <button type="submit" value="keep" class="button accent">保留</button>
    </footer>
  </form>
</dialog>
<dialog id="desktop-update-dialog" class="desktop-dialog desktop-update-dialog" aria-labelledby="desktop-update-title">
  <form method="dialog">
    <header><h2 id="desktop-update-title">程序更新</h2><button type="submit" class="button" aria-label="关闭更新窗口">关闭</button></header>
  </form>
  <p id="desktop-update-version"></p>
  <p id="desktop-update-message" role="status"></p>
  <progress id="desktop-update-progress" max="100" aria-label="更新下载进度" hidden></progress>
  <pre id="desktop-update-notes" hidden></pre>
  <div class="desktop-update-actions">
    <button id="desktop-update-action" type="button" class="button accent" hidden></button>
    <button id="desktop-update-browser" type="button" class="button" hidden>用浏览器下载</button>
  </div>
</dialog>
