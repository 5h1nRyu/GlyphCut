<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="绘制网格模板，点选区块制作字形，并导出 TTF 与 SVG。">
<title>字形切片</title>
<link rel="stylesheet" href="style.css">
<script defer src="geometry.js"></script>
<script defer src="truetype.js"></script>
<script defer src="studio.js"></script>
</head>
<body>
<svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M4 16v4h16v-4M12 16V4m-4 4 4-4 4 4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M4 16v4h16v-4M12 4v12m-4-4 4 4 4-4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></symbol>
  <symbol id="i-glyph" viewBox="0 0 24 24"><path d="M4 20 10.5 4h3L20 20M7 14h10"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="m5 4 15 9-8 1.5L8.5 21 5 4Z"/></symbol>
  <symbol id="i-line" viewBox="0 0 24 24"><path d="m6 18 12-12"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></symbol>
  <symbol id="i-curve" viewBox="0 0 24 24"><path d="M6 18C6 10 11 6 18 6"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></symbol>
  <symbol id="i-erase" viewBox="0 0 24 24"><path d="m6 18-3-3 9-10 8 7-6.2 7H7Zm1-7 8 7M13 19h8"/></symbol>
  <symbol id="i-exclude" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m6.4 17.6 11.2-11.2"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 10h10a5 5 0 0 1 0 10h-4M9 5l-5 5 5 5"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 10H10a5 5 0 0 0 0 10h4m1-15 5 5-5 5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
</svg>

<header class="top">
  <div class="identity">
    <div class="mark" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
    <h1>字形切片</h1>
  </div>
  <nav class="modes" aria-label="工作区">
    <button id="mode-template" class="mode selected" type="button" aria-pressed="true"><svg><use href="#i-grid"/></svg>模板编辑</button>
    <button id="mode-glyph" class="mode" type="button" aria-pressed="false"><svg><use href="#i-glyph"/></svg>字形设计</button>
  </nav>
  <div class="files">
    <button id="import" class="top-button" type="button"><svg><use href="#i-import"/></svg>导入</button>
    <button id="save" class="top-button solid" type="button"><svg><use href="#i-download"/></svg>保存项目</button>
    <input type="file" id="open-file" accept=".json,application/json" hidden>
  </div>
</header>

<main class="workbench">
  <aside class="panel left" aria-label="绘图设置">
    <div class="panel-inner" id="template-controls">
      <section id="desktop-template-identity" hidden>
        <h2 id="desktop-template-name-title">模板名称</h2>
        <input id="desktop-template-name" aria-labelledby="desktop-template-name-title" maxlength="100" spellcheck="false">
      </section>
      <section id="canvas-settings">
        <h2>画布与网格</h2>
        <form id="dimensions">
          <div class="fields">
            <label>画布宽<input id="width" type="number" min="1" max="8192" step="any" required></label>
            <label>画布高<input id="height" type="number" min="1" max="8192" step="any" required></label>
            <label>单格宽<input id="stepX" type="number" min=".01" max="8192" step="any" required></label>
            <label>单格高<input id="stepY" type="number" min=".01" max="8192" step="any" required></label>
          </div>
          <button class="button block" id="apply-dimensions" type="submit">应用尺寸</button>
        </form>
      </section>
      <section class="split">
        <h2>绘图工具</h2>
        <div id="tools" class="tools">
          <button class="tool" data-tool="line" type="button"><svg><use href="#i-line"/></svg><span>直线</span><kbd>L</kbd></button>
          <button class="tool" data-tool="curve" type="button"><svg><use href="#i-curve"/></svg><span>曲线</span><kbd>Q</kbd></button>
          <button class="tool" data-tool="select" type="button"><svg><use href="#i-select"/></svg><span>选择</span><kbd>V</kbd></button>
          <button class="tool" data-tool="erase" type="button"><svg><use href="#i-erase"/></svg><span>删除</span><kbd>E</kbd></button>
          <button class="tool" data-tool="exclude" type="button" title="生成模板后可禁用区块" disabled><svg><use href="#i-exclude"/></svg><span>禁用区块</span><kbd>X</kbd></button>
        </div>
        <p class="help" id="tool-help"></p>
        <dl id="curve-definition" class="curve-definition" aria-label="曲线定义点" hidden>
          <div><dt><span>起点</span></dt><dd id="curve-point-a"></dd></div>
          <div><dt><span>控制点</span></dt><dd id="curve-point-c"></dd></div>
          <div><dt><span>终点</span></dt><dd id="curve-point-b"></dd></div>
        </dl>
      </section>
      <section class="left-actions">
        <button type="button" id="generate" class="button accent block">生成模板</button>
        <button type="button" id="clear-template" class="button clear block">清空线条</button>
      </section>
    </div>
    <div class="panel-inner" id="glyph-controls" hidden>
      <section>
        <h2>字形填充</h2>
        <div class="character-tabs glyph-tools" id="glyph-tools" aria-label="填充方式">
          <button type="button" data-glyph-tool="regions" class="selected" aria-pressed="true">区块填充</button>
          <button type="button" data-glyph-tool="points" aria-pressed="false">选点填充</button>
        </div>
        <p class="help" id="region-fill-help">点击区块切换填充，按住拖动可连续填充经过的区块。</p>
        <div id="point-fill-controls" hidden>
          <p class="help">鼠标靠近时显示模板点。点回起点闭合，滚轮切换最后一段，右键撤回上一个点。</p>
          <p class="help" id="point-fill-status" aria-live="polite" hidden></p>
          <div class="stack">
            <button class="button clear block" id="cycle-point-connection" type="button" hidden>切换连线</button>
            <button class="button accent block" id="fill-point-outline" type="button" disabled>填充围合区域</button>
            <button class="button block" id="clear-point-outline" type="button" disabled>取消围合区域填充</button>
          </div>
        </div>
        <p class="help" id="glyph-disabled-help" hidden>斜纹区块已禁用。</p>
      </section>
      <section class="split">
        <h2>字体设置</h2>
        <div class="fields">
          <label class="wide">字体名称<input id="font-name" maxlength="100" spellcheck="false"></label>
          <label class="baseline-setting">基线位置 (%)<input id="baseline" type="number" min="0" max="100" step="any"></label>
          <label class="spacing-setting">两侧留白<input id="spacing" type="number" min="0" max="8192" step="any"></label>
        </div>
        <p class="help"><span class="baseline-setting">基线从画布顶端向下计量。</span>两侧留白采用画布单位。</p>
      </section>
      <section class="split">
        <h2>导出</h2>
        <div class="stack">
          <button id="simplify-template" class="button block" type="button">一键简化模板</button>
          <button id="export-ttf" class="button accent block" type="button"><svg><use href="#i-download"/></svg>导出 TTF</button>
          <button id="export-svg" class="button block" type="button"><svg><use href="#i-download"/></svg>导出当前 SVG</button>
          <button id="export-all-svg" class="button block" type="button"><svg><use href="#i-download"/></svg>导出全部字形 SVG</button>
          <button id="export-all-png" class="button block" type="button"><svg><use href="#i-download"/></svg>导出全部字形 PNG</button>
          <button id="export-template" class="button block" type="button"><svg><use href="#i-download"/></svg>导出模板 JSON</button>
        </div>
      </section>
    </div>
  </aside>

  <section class="drawing" aria-labelledby="drawing-title">
    <div class="workbar">
      <div class="workspace-title"><span class="live" aria-hidden="true"></span><h2 id="drawing-title">模板画布</h2></div>
      <div class="work-tools">
        <div class="tool-group">
          <button class="icon-button" type="button" id="undo" title="撤销 (Ctrl+Z)" aria-label="撤销"><svg><use href="#i-undo"/></svg></button>
          <button class="icon-button" type="button" id="redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做"><svg><use href="#i-redo"/></svg></button>
        </div>
        <div class="tool-group" id="zoom-tools">
          <button class="icon-button" type="button" id="zoom-out" title="缩小" aria-label="缩小"><svg><use href="#i-minus"/></svg></button>
          <button class="zoom-readout" type="button" id="fit" title="适应画布">100%</button>
          <button class="icon-button" type="button" id="zoom-in" title="放大" aria-label="放大"><svg><use href="#i-plus"/></svg></button>
        </div>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="stage-content" id="stage-content">
        <svg id="drawing-svg" xmlns="http://www.w3.org/2000/svg" aria-label="绘图画布"></svg>
      </div>
    </div>
    <div class="statusbar">
      <span id="canvas-status"></span>
      <span id="glyph-vertex-status" hidden>轮廓顶点 <span id="glyph-vertex-count">0</span></span>
      <span id="coordinates"></span>
      <label class="grid-switch"><input id="show-grid" type="checkbox" checked>显示网格</label>
    </div>
  </section>

  <aside class="panel right" aria-label="预览与字库">
    <div class="panel-inner" id="template-preview">
      <section>
        <h2>模板预览</h2>
        <div class="preview-metrics">
          <div><output id="region-count">—</output><span>区块</span></div>
          <div><output id="stroke-count">0</output><span>线条</span></div>
        </div>
        <p id="template-status" class="help" aria-live="polite">绘制分割线后生成区块。</p>
        <button id="use-template" class="button accent block" type="button" disabled>使用模板</button>
      </section>
      <section class="split example-section">
        <h2>示例模板</h2>
        <button class="example" type="button" id="load-example">
          <svg viewBox="0 0 128 92" aria-hidden="true">
            <defs><pattern id="tile-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#354254" stroke-width=".6"/></pattern></defs>
            <rect width="128" height="92" fill="url(#tile-grid)"/>
            <g fill="#c6f768">
              <path d="M39 13Q64 6 89 13L96 19 89 24H39L32 19Z"/>
              <path d="M39 41H89L96 46 89 51H39L32 46Z"/>
              <path d="M39 68H89L96 73 89 79Q64 86 39 79L32 73Z"/>
              <path d="M27 23 33 28V38L27 43 21 38V28Zm0 26 6 5v10l-6 5-6-5V54Zm74-26 6 5v10l-6 5-6-5V28Zm0 26 6 5v10l-6 5-6-5V54Z"/>
            </g>
          </svg>
          <span><strong>七段数字</strong><small>载入示例</small></span>
        </button>
      </section>
    </div>
    <div class="panel-inner" id="glyph-preview" hidden>
      <section>
        <div class="section-head"><h2>字库</h2><span id="glyph-count"></span></div>
        <div id="character-tabs" class="character-tabs" aria-label="字符类别">
          <button type="button" data-group="upper" class="selected">大写</button>
          <button type="button" data-group="lower">小写</button>
          <button type="button" data-group="digits">数字</button>
        </div>
        <div class="characters" id="characters" aria-label="选择字符"></div>
        <button type="button" class="button clear block" id="clear-glyph">清空当前字形</button>
      </section>
      <section class="split">
        <h2>排版预览</h2>
        <input class="sample-input" id="sample-text" aria-label="排版预览文字" value="ABC 123" maxlength="100" spellcheck="false">
        <div class="sample-output" id="sample-output" aria-label="字形排版预览"></div>
      </section>
    </div>
  </aside>
</main>
<div id="notification" class="notification" role="status" hidden></div>
</body>
</html>
