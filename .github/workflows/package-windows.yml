name: 打包 Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/package-windows.yml', 'desktop/**']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 验证更新与项目删除
        run: node --test desktop/tests/desktop.test.cjs
      - name: 验证 Windows 更新与回退
        timeout-minutes: 2
        shell: powershell
        run: ./desktop/tests/portable-update.test.ps1
      - name: 生成程序包
        run: python desktop/package-windows.py
      - name: 验证更新后自动重启
        timeout-minutes: 3
        shell: powershell
        run: ./desktop/tests/restart-update.test.ps1
      - name: 上传程序包
        uses: actions/upload-artifact@v7
        with:
          path: GlyphCut-Windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release GlyphCut ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: GlyphCut-Windows-x64.zip
          path: release-package
          skip-decompress: true
      - name: 发布 Windows 更新包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(release-package/*)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          mv -- "${files[0]}" GlyphCut-Windows-x64.zip
          version=$(node -p "require('./desktop/package.json').version")
          zip_version=$(unzip -p GlyphCut-Windows-x64.zip GlyphCut-Windows-x64/resources/app/package.json |
            node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
          test "$version" = "$zip_version"
          git log -1 --format=%b "$GITHUB_SHA" > release-notes.md
          gh release create "v$version" GlyphCut-Windows-x64.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "GlyphCut v$version" --notes-file release-notes.md --latest
