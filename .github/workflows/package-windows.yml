name: 打包 Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/package-windows.yml', 'desktop/**']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 验证更新与项目删除
        run: node --test desktop/tests/desktop.test.cjs
      - name: 验证 Windows 更新与回退
        timeout-minutes: 2
        shell: powershell
        run: ./desktop/tests/portable-update.test.ps1
      - name: 生成程序包
        run: python desktop/package-windows.py
      - name: 上传程序包
        uses: actions/upload-artifact@v7
        with:
          path: GlyphCut-Windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
